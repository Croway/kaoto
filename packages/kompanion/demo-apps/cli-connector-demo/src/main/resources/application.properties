camel.main.name = cli-connector-demo-${camel.version}
camel.main.routes-include-pattern = classpath:camel/*.camel.yaml
# the backlog tracer and debugger are woven into the routes at startup only: standby lets the Kompanion turn them on
camel.trace.standby = true
camel.debug.standby = true
# camel-cli-connector is on with its jar; its transport (file by default) is set on the command line
# the Kafka broker of the shipping topic: the one of `camel infra run kafka`
camel.component.kafka.brokers = localhost:9092
# without a broker, sending fails after 5 seconds instead of 60
camel.component.kafka.max-block-ms = 5000
